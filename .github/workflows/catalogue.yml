name: Build Catalogue

on:
  schedule:
    - cron: '30 20 * * *'      # roz raat 2:00 AM IST
  workflow_dispatch:            # manual button bhi milega

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install

      - name: Build PDFs
        env:
          SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
        run: npm run build

      - name: Publish to Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
          cname: catalogue.pixelledlights.com

      # GitHub 60 din tak koi commit na ho to cron band kar deta hai.
      # Ye har build par ek chhoti file update karke usse zinda rakhta hai.
      - name: Keep schedule alive
        run: |
          date -u +"Last build: %Y-%m-%d %H:%M UTC" > .last-build
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last-build
          git diff --staged --quiet || git commit -m "keepalive: last build timestamp [skip ci]"
          git push
